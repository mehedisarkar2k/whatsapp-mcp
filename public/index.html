<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>WhatsApp MCP</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <img class="logo" src="logo.svg" alt="" width="34" height="34" />
      <div class="titles">
        <h1>WhatsApp MCP</h1>
        <span class="version" id="version"></span>
      </div>
    </header>

    <section class="card">
      <div class="toggle-row">
        <div class="toggle-text">
          <span class="toggle-title">WhatsApp access</span>
          <span class="toggle-status" id="access-status"></span>
        </div>
        <label class="switch">
          <input type="checkbox" id="access-toggle" />
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <section class="status-list">
      <div class="status-row">
        <span class="status-label">Server</span>
        <span class="status-value">127.0.0.1 only, token protected</span>
      </div>
      <div class="status-row">
        <span class="status-label">Database</span>
        <span class="status-value" id="database-status"></span>
      </div>
    </section>

    <div class="actions">
      <button class="btn btn-primary" id="copy-config">Copy Claude config</button>
      <button class="btn btn-secondary" id="reset-token">Reset token</button>
      <button class="btn btn-secondary" id="quit">Quit</button>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
